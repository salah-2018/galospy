name: scrape
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: scrape
        continue-on-error: true
        run: node scraper/scrape.mjs
      - name: enrich
        continue-on-error: true
        run: node scraper/enrich.mjs
      - name: analyze
        run: node scraper/analyze.mjs
      - name: notify
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: node scraper/notify.mjs
      - name: commit data
        if: always()
        run: |
          git config user.name "adspy-bot"
          git config user.email "adspy-bot@users.noreply.github.com"
          git add docs/data docs/media
          git diff --cached --quiet || (git commit -m "data $(date -u +%F-%H%M)" && git pull --rebase && git push)
