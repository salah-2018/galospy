<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ad Spy أونلاين</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--pr:#1a56db;--ok:#0a7d3b;--no:#dc2626;--wa:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--pr:#60a5fa;--ok:#4ade80;--no:#f87171;--wa:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,Tahoma,sans-serif;padding:14px}
h1{font-size:18px;margin:0 0 8px}.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}select,input{padding:6px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.p{display:flex;gap:12px}.p img{width:110px;height:110px;object-fit:cover;border-radius:8px;background:var(--bd);flex:none}
.t span{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--bg);margin:0 0 4px 4px;font-size:12px}.ok{color:var(--ok)}.no{color:var(--no)}
.tx{color:var(--mu);white-space:pre-wrap;max-height:70px;overflow:hidden;margin:6px 0}.wk{display:flex;gap:3px;align-items:flex-end;height:34px}.wk i{width:10px;background:var(--pr);display:block;border-radius:2px 2px 0 0}
details{margin-top:6px}table{border-collapse:collapse;width:100%}td,th{padding:4px 8px;border-bottom:1px solid var(--bd);text-align:right}a{color:var(--pr)}
</style></head><body>
<h1>Ad Spy أونلاين</h1><div class="box" id="meta">جاري التحميل...</div>
<div class="bar"><select id="co"><option value="">كل الدول</option></select><select id="ni"><option value="">كل المجالات</option></select><label><input type="checkbox" id="cd" checked> المرشحون فقط</label><span id="cnt" style="color:var(--mu)"></span></div>
<div id="list"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NI={home_kitchen:'منزل ومطبخ',beauty:'تجميل',auto:'سيارات',electronics:'إلكترونيات',fashion:'أزياء',kids:'أطفال',health_fitness:'صحة ورياضة',tools_garden:'أدوات وحديقة',other:'أخرى'};
const CK={advertisers:'عدد المعلنين',proven:'معلنون صامدون',notSaturated:'غير مشبع',lowKillRate:'قلة من أوقفه سريعاً',price:'السعر'};
let P=[];
Promise.all([fetch('data/products.json?'+Date.now()).then(r=>r.json()),fetch('data/meta.json?'+Date.now()).then(r=>r.json())]).then(([pr,m])=>{
 P=pr.products||[];
 const qs=(m.queries||[]).map(q=>`<tr><td>${q.c}</td><td>${esc(q.q)}</td><td>${q.cards??'-'}</td><td>${q.found??'-'}</td><td class="${q.error?'no':''}">${esc(q.error||'ok')}</td></tr>`).join('');
 $('#meta').innerHTML=`آخر تشغيل: <b>${m.lastRun?new Date(m.lastRun).toLocaleString('ar'):'لم يعمل بعد'}</b> | إعلانات محفوظة: <b>${m.total||0}</b> | منتجات: <b>${pr.total||0}</b> | مرشحون: <b>${pr.candidates||0}</b>${m.abort?`<p class="no">${esc(m.abort)}</p>`:''}<details><summary>نتائج آخر دورة مسح</summary><table><tr><th>الدولة</th><th>الكلمة</th><th>بطاقات</th><th>مستخرج</th><th>الحالة</th></tr>${qs}</table></details>`;
 [...new Set(P.flatMap(p=>p.countries))].forEach(c=>$('#co').add(new Option(c,c)));
 [...new Set(P.map(p=>p.niche))].forEach(n=>$('#ni').add(new Option(NI[n]||n,n)));
 draw();
});
['co','ni','cd'].forEach(i=>$('#'+i).addEventListener('input',()=>draw()));
function draw(){
 const c=$('#co').value,n=$('#ni').value,cd=$('#cd').checked;
 const r=P.filter(p=>(!c||p.countries.includes(c))&&(!n||p.niche===n)&&(!cd||p.candidate));
 $('#cnt').textContent=r.length+' منتج';
 const mx=p=>Math.max(1,...p.weekly);
 $('#list').innerHTML=r.slice(0,100).map(p=>`<div class="box p">${p.thumb?`<img src="${esc(p.thumb)}" loading="lazy" referrerpolicy="no-referrer">`:'<img>'}<div style="flex:1;min-width:0">
 <b>${esc(p.label)}</b> <small style="color:var(--mu)">${esc(NI[p.niche]||p.niche)} | ${p.countries.join('/')}</small>${p.isNew?' <b class="ok">جديد</b>':''}
 <div class="t"><span>${p.adv} معلن</span><span>${p.proven} صامد</span><span>${p.killed} أوقفوه سريعاً</span><span>${p.ent} دخلوا آخر 14 يوم</span><span>أطول عرض ${p.maxDays} يوم</span>${p.price.med?`<span>السعر ${p.price.min}–${p.price.max} (وسيط ${p.price.med})</span>`:''}${p.bundlePct?`<span>حزم ${p.bundlePct}%</span>`:''}${p.apps.map(a=>`<span>${esc(a)}</span>`).join('')}</div>
 <div class="t">${Object.entries(p.checks).map(([k,v])=>`<span class="${v===true?'ok':v===false?'no':''}">${v===true?'✓':v===false?'✗':'؟'} ${CK[k]}</span>`).join('')}</div>
 <div class="wk" title="معلنون جدد أسبوعياً">${p.weekly.slice().reverse().map(n=>`<i style="height:${Math.round(n/mx(p)*30)+3}px"></i>`).join('')}</div>
 <div class="tx">${esc(p.texts[0]||'')}</div>
 <details><summary>المعلنون (${p.advertisers.length})</summary><table>${p.advertisers.map(a=>`<tr><td>${esc(a.page)}</td><td>${a.days} يوم</td><td>${a.status==='inactive'?'متوقف':'نشط'}</td><td>${a.price||''}</td><td>${esc(a.platform)}${a.store?' ('+a.store.products+' منتج)':''}</td><td>${a.dest?`<a href="${esc(a.dest)}" target="_blank" rel="noopener noreferrer">الوجهة</a>`:''}</td></tr>`).join('')}</table></details>
 </div></div>`).join('')||'<div class="box">لا نتائج. إن كان التشغيل الأول لم يكتمل فشغّل workflow يدوياً من تبويب Actions.</div>';
}
</script></body></html>
